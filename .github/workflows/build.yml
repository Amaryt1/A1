name: Build FBAMARYT Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Theos & SDK
        id: cache-theos
        uses: actions/cache@v3
        with:
          path: ~/theos
          key: ${{ runner.os }}-theos-sdk14.5

      - name: Setup Theos and Minimal SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.zip
          unzip -q iPhoneOS14.5.sdk.zip -d ~/theos/sdks/
          rm iPhoneOS14.5.sdk.zip

      - name: Compile Dylib
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBAMARYT-Dylib
          path: |
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
